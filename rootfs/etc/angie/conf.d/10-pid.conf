# No pid file at all. The package default (/run/angie.pid) is root-owned, and a
# pid file moved to a shared writable dir breaks a later run under another uid
# (`docker run --user`): `open() ... angie.pid failed (13: Permission denied)`.
# Its only consumer is `angie -s <signal>`; signal the container instead
# (`docker kill -s HUP <container>`), tini forwards it to the master. `angie -s`
# fails loudly with `no PID file configured`.
pid off;
