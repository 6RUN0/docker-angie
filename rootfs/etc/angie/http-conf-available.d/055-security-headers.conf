# Baseline security response headers, modelled on h5bp/server-configs-nginx
# (MIT): h5bp/security/ plus the maps from its root nginx.conf.
# https://angie.software/angie/docs/configuration/modules/http/http_headers/
#
# Three of the four headers go through a map keyed on the content type: they
# concern documents and are dead weight on images, fonts or archives. An empty
# map value adds no header at all, so no extra condition is needed. Cost: a
# response whose type matches no map gets none of the three; under
# `default_type application/octet-stream` that is any unknown extension.
#
# CAVEAT: add_header does NOT merge - a server/location that defines its own
# add_header replaces the inherited set, dropping these. If a custom vhost adds
# headers, repeat the ones below there too.

# h5bp uses DENY here. A general-purpose image cannot know whether a consumer
# frames its own pages, and DENY breaks that silently with a 200 response.
map $sent_http_content_type $_stock_x_frame_options {
  ~*text/html SAMEORIGIN;
}

# text/css is included on purpose: a stylesheet triggers subrequests (fonts,
# images, @import) that carry a Referer.
map $sent_http_content_type $_stock_referrer_policy {
  ~*text/(css|html|javascript)|application/pdf|xml "strict-origin-when-cross-origin";
}

# The full h5bp feature list: the header forbids only what it lists, so a short
# list is a short ban.
map $sent_http_content_type $_stock_permissions_policy {
  ~*text/(html|javascript)|application/pdf|xml "accelerometer=(),autoplay=(),browsing-topics=(),camera=(),display-capture=(),document-domain=(),encrypted-media=(),fullscreen=(),geolocation=(),gyroscope=(),magnetometer=(),microphone=(),midi=(),payment=(),picture-in-picture=(),publickey-credentials-get=(),screen-wake-lock=(),sync-xhr=(self),usb=(),web-share=(),xr-spatial-tracking=()";
}

# `always` emits the headers on error responses (4xx/5xx) too; angie error
# pages are text/html, so the maps above match them. X-Content-Type-Options
# stays unconditional: MIME sniffing concerns any response, not only documents.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy $_stock_referrer_policy always;
add_header X-Frame-Options $_stock_x_frame_options always;
add_header Permissions-Policy $_stock_permissions_policy always;

# CSP and X-XSS-Protection are deliberately omitted: CSP is application-specific
# and X-XSS-Protection is deprecated. HSTS is a separate toggle
# (ANGIE_HSTS_ENABLED, 056-hsts.conf): it is irreversible and must not ride
# along with conservative defaults.
