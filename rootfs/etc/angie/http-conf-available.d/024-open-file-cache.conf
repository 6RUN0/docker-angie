# Cache of open descriptors, file metadata and "not found" errors.
# https://angie.software/angie/docs/configuration/modules/http/http_core/#open-file-cache
#
# Modelled on h5bp/server-configs-nginx 5.0.1 (MIT),
# h5bp/web_performance/cache-file-descriptors.conf.
#
# CAVEAT: the file size is cached with the descriptor, so a file edited on a
# mounted volume is served TRUNCATED to its old length until revalidation (up
# to open_file_cache_valid). Fits an immutable tree in the image or on a
# read-only volume, not one edited live.
#
# h5bp values: a descriptor is cached once requested twice within inactive,
# dropped after 20s unused, and rechecked against the disk every valid.
open_file_cache max=1000 inactive=20s;
open_file_cache_valid 30s;
open_file_cache_min_uses 2;

# Negative results are cached too, otherwise a stream of requests to a missing
# path hits the filesystem every time. Mirror cost: a newly created file is
# served as 404 until valid expires.
open_file_cache_errors on;
