# UTF-8 charset in the Content-Type of text responses.
# https://angie.software/angie/docs/configuration/modules/http/http_charset/
#
# Modelled on h5bp/server-configs-nginx 5.0.1 (MIT),
# h5bp/media_types/character_encodings.conf.
#
# Added only to responses that declare no charset of their own: a proxied
# `text/html; charset=windows-1251` passes through unchanged. Recoding would
# need source_charset, deliberately absent: a foreign response's charset cannot
# be guessed.
charset utf-8;

# text/html is always handled; the list covers the other text types. It
# replaces the angie default (text/html text/xml text/plain text/vnd.wap.wml
# application/javascript application/rss+xml) entirely, so text/xml and
# application/rss+xml, not listed here, get no charset.
charset_types
  text/css
  text/plain
  text/vnd.wap.wml
  text/javascript
  text/markdown
  text/calendar
  text/x-component
  text/vcard
  text/cache-manifest
  text/vtt
  application/json
  application/manifest+json;
