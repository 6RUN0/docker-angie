# logfmt variant with the country field. Enabled only together with geoip2:
# angie validates the variables of EVERY declared log_format, so an orphaned
# format referencing $_stock_geoip2_country_code fails `angie -t`. Quoting
# rules match 030-log-format-logfmt.conf.
log_format angie_logfmt_with_geoip 'remote_addr=$remote_addr'
  ' remote_user="$remote_user"'
  ' host=$host'
  ' path="$request_uri"'
  ' method=$request_method'
  ' status=$status'
  ' referrer="$http_referer"'
  ' user_agent="$http_user_agent"'
  ' length=$bytes_sent'
  ' gzip_ratio=$gzip_ratio'
  ' request_time=$request_time'
  ' upstream_addr=$upstream_addr'
  ' date=$time_iso8601'
  ' country="$_stock_geoip2_country_code"'
  ' request_id=$request_id';
