# Loki log format: ANGIE_LOG_LOGFMT=yes enables the format and the access log,
# ANGIE_LOG_FORMAT_LOGFMT=yes only the format. The default is json
# (030-log-format-json.conf).
# `path` uses $request_uri, which includes the raw query string: any secret
# carried in a URL (?token=, ?api_key=, session ids) is written to stdout. Swap
# to $uri in your own format if you serve secrets in query params; the default
# keeps $request_uri because dashboards expect the full path.
# Every client-controlled value is quoted: unquoted, a space in Referer or in
# the Authorization user name would append forged `status=200 host=...` pairs
# that a logfmt parser takes as real. angie escapes an inner quote as \x22.
log_format angie_logfmt 'remote_addr=$remote_addr'
  ' remote_user="$remote_user"'
  ' host=$host'
  ' path="$request_uri"'
  ' method=$request_method'
  ' status=$status'
  ' referrer="$http_referer"'
  ' user_agent="$http_user_agent"'
  ' length=$bytes_sent'
  ' gzip_ratio=$gzip_ratio'
  ' request_time=$request_time'
  ' upstream_addr=$upstream_addr'
  ' date=$time_iso8601'
  ' request_id=$request_id';
