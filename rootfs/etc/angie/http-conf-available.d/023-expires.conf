# Cache lifetime by content type: the map declaration only.
# https://angie.software/angie/docs/configuration/modules/http/http_headers/
#
# Modelled on h5bp/server-configs-nginx 5.0.1 (MIT),
# h5bp/web_performance/cache_expiration.conf.
#
# The `expires` directive itself lives in snippets/expires-by-type.conf, to be
# included in the location serving static files. h5bp sets `expires` in the
# http context, which also covers proxied responses and overrides the backend's
# policy (`Cache-Control: max-age=60, public` becomes `no-cache`). The image is
# used both as a static server and as a proxy, so the choice stays with the
# consumer; do not "align with upstream".
#
# CAVEAT: `default` also covers application/octet-stream, i.e. any file whose
# type is not recognized by extension (the image's default_type). Enable only
# with versioned file names (snippets/cache-busting.conf), or an edited file
# reaches clients a year later. The empty value is a response without a body.
map $sent_http_content_type $_stock_expires {
  default                      1y;
  ""                           off;

  ~*image/svg\+xml             1y;
  ~*image/vnd.microsoft.icon   1w;
  ~*image/x-icon               1w;

  ~*application/manifest\+json 1w;
  ~*text/cache-manifest        epoch;

  ~*application/atom\+xml      1h;
  ~*application/rdf\+xml       1h;
  ~*application/rss\+xml       1h;

  ~*text/html                  epoch;
  ~*text/markdown              epoch;
  ~*text/calendar              epoch;

  ~*text/x-cross-domain-policy 1w;

  ~*json                       epoch;
  ~*xml                        epoch;
}
