# https://angie.software/angie/docs/configuration/modules/core/

# Includes mapping of file name extensions to MIME types of responses and
# defines the default type. The path is relative to the prefix: an absolute one
# would read the /etc/angie skeleton instead of the live tree.
include mime.types;
default_type application/octet-stream;

# Don't tell angie version to the clients. Default is 'on'.
server_tokens off;

# Maximum number of request header fields. The angie default of 1000 serves no
# real client, only a request built to waste memory and parse time; excess
# gives 400. Field size is capped separately by large_client_header_buffers.
max_headers 100;

# Sendfile copies data between one FD and other from within the kernel,
# which is more efficient than read() + write(). Default is off.
sendfile on;

# Causes angie to attempt to send its HTTP response head in one packet,
# instead of using partial frames. Default is 'off'.
tcp_nopush on;

# Temp dirs live in /data/tmp, not the root-owned /var/cache/angie (see
# ANGIE_TMP_DIR in docker-entrypoint-common.sh), so the unprivileged master can
# create them and a proxy cache under /data shares their filesystem. They live
# here because no toggle ever disables this default-active snippet. Disabling
# 010-common.conf therefore also moves the temp dirs back to /var/cache/angie,
# drops $_stock_time_ms (json log formats stop parsing) and $_stock_loopback
# (snippets/healthz.conf fails with `unknown "_stock_loopback" variable`).
client_body_temp_path /data/tmp/client_temp;
proxy_temp_path /data/tmp/proxy_temp;
fastcgi_temp_path /data/tmp/fastcgi_temp;
uwsgi_temp_path /data/tmp/uwsgi_temp;
scgi_temp_path /data/tmp/scgi_temp;

# Millisecond timestamp for the json log formats. Declared once here: a second
# time_format on the same name fails `angie -t`, and both json formats may be
# active at once. $time_local and $time_iso8601 have no fractions, so records
# within one second could not be ordered. Local time (UTC in the image); the
# offset is printed because a mounted /etc/localtime would make a literal Z lie.
time_format $_stock_time_ms "%Y-%m-%dT%H:%M:%S.%L%Z";

# Universal loopback classifier: 1 when the request originates from the local
# host, 0 otherwise. Used by snippets/healthz.conf, which both the built-in and
# consumer vhosts include, so it lives in http {} rather than in one vhost.
#
# Keys on $realip_remote_addr, the TCP peer before real_ip substitution (equal
# to $remote_addr without real_ip). With ANGIE_REAL_IP_FROM set, $remote_addr
# becomes the header value, and a client behind a trusted proxy sending
# X-Forwarded-For: 127.0.0.1 would pass. A loopback neighbour (sidecar, proxy
# in the same netns) passes honestly, and so does whatever it forwards.
geo $realip_remote_addr $_stock_loopback {
  default              0;
  127.0.0.0/8          1;
  ::1/128              1;
  ::ffff:127.0.0.0/104 1;
}
