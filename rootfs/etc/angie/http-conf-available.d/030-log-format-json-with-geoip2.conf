# json variant with the country field. Enabled only together with geoip2: the
# format references $_stock_geoip2_country_code, and angie validates the
# variables of EVERY declared log_format, so an orphaned format fails
# `angie -t`. Quoting rules and escape=json match 030-log-format-json.conf.
log_format angie_json_with_geoip escape=json '{'
  '"date":"$_stock_time_ms"'
  ',"remote_addr":"$remote_addr"'
  ',"remote_user":"$remote_user"'
  ',"host":"$host"'
  ',"path":"$request_uri"'
  ',"method":"$request_method"'
  ',"status":$status'
  ',"referrer":"$http_referer"'
  ',"user_agent":"$http_user_agent"'
  ',"length":$bytes_sent'
  ',"gzip_ratio":"$gzip_ratio"'
  ',"request_time":$request_time'
  ',"upstream_addr":"$upstream_addr"'
  ',"country":"$_stock_geoip2_country_code"'
  ',"request_id":"$request_id"'
  '}';
