# SSL Settings
# https://angie.software/angie/docs/configuration/modules/http/http_ssl/
#
# Shared TLS policy for the http {} context. The image exposes plain HTTP only
# (:80 root, :8080 unprivileged) and no server does `listen ... ssl`, so these
# directives are inert until you add a TLS listener via /etc/angie/custom; set
# certificates there and override the policy per vhost if needed. Angie
# defaults ssl_protocols to TLSv1.2 TLSv1.3, so this file deliberately pins no
# protocol floor.

ssl_session_cache shared:SSL_ANGIE_CACHE:5m;
# Specifies a time during which a client may reuse the session parameters.
# Default is '5m'.
ssl_session_timeout 1h;
# angie generates the ticket key itself and keeps it until reload: a leaked key
# decrypts all recorded traffic, no forward secrecy. Resumption relies on the
# session cache above.
ssl_session_tickets off;
# TLS 1.2 ciphers from the Mozilla intermediate profile (guidelines 6.0): AEAD
# with ECDHE only. The build default also accepts CBC with SHA1. TLS 1.3 suites
# are not set by this directive. Check against the current profile:
#   curl -fsS https://ssl-config.mozilla.org/guidelines/latest.json | jq '.configurations.intermediate.ciphers.openssl'
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
# Let the client choose the cipher. With an all-AEAD cipher list, client
# preference lets mobile clients without AES-NI pick ChaCha20-Poly1305 over
# AES-GCM; Mozilla and the nginx/angie maintainers recommend off. Default 'off'.
ssl_prefer_server_ciphers off;
