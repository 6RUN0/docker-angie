# Default access log format: one JSON line per request.
#
# `escape=json` is required: without it a quote or backslash, common in
# $request_uri and $http_user_agent, breaks out of the string, and anyone able
# to craft a URL can corrupt the log. With it angie escapes by itself.
#
# Every field is quoted except three numeric ones. An unquoted empty variable
# gives `"gzip_ratio":,`, invalid JSON, so the whole line is lost, and most
# values can be empty ($gzip_ratio without compression, $upstream_addr without
# proxying, $remote_user without auth): quote new fields by default. Only
# $status, $bytes_sent and $request_time stay bare: always set, and more useful
# as numbers for aggregation.
#
# `path` uses $request_uri, which includes the raw query string: any secret
# carried in a URL (?token=, ?api_key=, session ids) is written to stdout. Swap
# to $uri in your own format if you serve secrets in query params; the default
# keeps $request_uri because dashboards expect the full path.
log_format angie_json escape=json '{'
  '"date":"$_stock_time_ms"'
  ',"remote_addr":"$remote_addr"'
  ',"remote_user":"$remote_user"'
  ',"host":"$host"'
  ',"path":"$request_uri"'
  ',"method":"$request_method"'
  ',"status":$status'
  ',"referrer":"$http_referer"'
  ',"user_agent":"$http_user_agent"'
  ',"length":$bytes_sent'
  ',"gzip_ratio":"$gzip_ratio"'
  ',"request_time":$request_time'
  ',"upstream_addr":"$upstream_addr"'
  ',"request_id":"$request_id"'
  '}';
