# Access-Control-Allow-Origin for fonts and images.
# https://angie.software/angie/docs/configuration/modules/http/http_headers/
#
# Modelled on h5bp/server-configs-nginx 5.0.1 (MIT),
# h5bp/cross-origin/requests.conf plus the map from its root nginx.conf.
#
# The map keys on the content type, not on Origin: it fixes fonts a browser
# refuses to load cross-origin, it does not open the application to
# cross-origin requests. Other types get an empty value, and add_header with an
# empty value sends no header.
#
# CAVEAT: add_header does not merge - a server or location with its own
# add_header drops this header together with 055-security-headers.conf. With
# two chained angie servers both using this snippet the header is sent twice,
# and the browser rejects a response with two Access-Control-Allow-Origin
# values outright; keep it enabled on only one of them.
map $sent_http_content_type $_stock_cors_assets {
  ~*font/                         "*";
  ~*image/                        "*";
  ~*application/vnd.ms-fontobject "*";
  ~*application/x-font-ttf        "*";
  ~*application/font-woff         "*";
  ~*application/x-font-woff       "*";
  ~*application/font-woff2        "*";
}

add_header Access-Control-Allow-Origin $_stock_cors_assets;
