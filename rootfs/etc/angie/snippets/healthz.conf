# Health endpoint polled by the built-in HEALTHCHECK. Include inside server {}:
#   include snippets/healthz.conf;
#
# The include path is relative to the prefix, not to the including file, so the
# same line works from the built-in vhost and from /etc/angie/custom/http.d.
#
# Needs $_stock_loopback from 010-common.conf, active by default; disabling it
# fails startup with `[emerg] unknown "_stock_loopback" variable`.
#
# `allow`/`deny` would be ineffective: `return` runs in the rewrite phase,
# before the access phase, so the access check never fires. Gate on
# $_stock_loopback instead (a documented-safe `if` containing only a `return`)
# and answer 404 to non-local clients so the endpoint is indistinguishable from
# "not configured".
location = /healthz {
  access_log off;

  # Nobody may cache the probe: an intermediary holding it would answer `ok`
  # for a dead server. Matters when expires-by-type.conf covers the whole
  # server: the octet-stream body falls into the default and would get
  # `max-age=31536000`. A no-op while ANGIE_EXPIRES_ENABLED is off.
  expires off;

  if ($_stock_loopback = 0) {
    return 404;
  }
  return 200 "ok\n";
}
