# Status listener body: /status/, /metrics and a 444 for everything else.
# Include inside server {}:
#   include snippets/status-api-locations.conf;
# You set the listener, its port and status_zone; the 070-status-api.conf
# template includes the same file, so both share one set of paths.
#
# The `all` prometheus template is declared in http {} and ships with the
# package, so a server {} of your own also needs `include prometheus_all.conf;`.
#
# No access control here by design: the listener targets a port that is not
# published. Restrict access yourself when publishing it.

# Off explicitly although it is the default: enabled, it serves the CONTENTS of
# every config file in config_files.
api_config_files off;

# Metrics scrapes are high-frequency noise in an access log.
access_log off;

location /status/ {
  api /status/;
}

location = /metrics {
  prometheus all;
}

location / {
  return 444;
}
