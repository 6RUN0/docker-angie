# Filename versioning: /app.v123.css is served from /app.css. Include inside
# server {}:
#   include snippets/cache-busting.conf;
#
# Modelled on h5bp/server-configs-nginx (MIT),
# h5bp/location/web_performance_filename-based_cache_busting.conf. It meets the
# precondition of the one-year default in 023-expires.conf (ANGIE_EXPIRES_ENABLED):
# names must be versioned, or an edit reaches cached clients only after a year.
# A query string (?v=123) does not work: shared caches and some proxies ignore
# it when matching. The extension list is kept as in h5bp, svgz included.
#
# Trap: this is a regex location, so a consumer prefix location with ^~ disables
# it entirely (`location ^~ /static/` makes /static/app.v123.css a 404). Also,
# try_files needs root or alias in the enclosing server.
location ~* "^(.+)\.(?:\w+)\.(avifs?|bmp|css|cur|gif|ico|jpe?g|jxl|m?js|a?png|svgz?|webp|webmanifest)$" {
  try_files $uri $1.$2;
}
