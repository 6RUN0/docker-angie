# Blocks every dotfile deployed with the site: .git, .env, .ssh, .npmrc, .aws
# and whatever comes next. Include inside server {}:
#   include snippets/deny-dotfiles.conf;
#
# Modelled on h5bp/server-configs-nginx (MIT),
# h5bp/location/security_file_access.conf. A negated exception instead of a
# list of names, which always lags behind. The only exception is
# /.well-known/, without which ACME certificates stop renewing.
#
# A server-level `if`, not a location, is the only form that works: a consumer
# prefix location with ^~ skips regex locations, so `location ^~ /static/`
# would serve /static/.git/config with 200. `if` runs in the rewrite phase,
# before location selection; it is the documented-safe kind, only a `return`.
#
# `~`, not `~*`: the block is case-independent anyway (/.GIT/ is blocked), but
# the exception stays literal, so /.WELL-KNOWN/ does not open a way in. $uri,
# not $request_uri: it is normalized and decoded, so /%2egit/config and
# /static/..%2f.git/config are caught too.
#
# Cost: dotfiles served on purpose are blocked as well, and no exception can be
# added after this. 404 rather than 403, so blocked is indistinguishable from
# missing.
if ($uri ~ "/\.(?!well-known/)") {
  return 404;
}
