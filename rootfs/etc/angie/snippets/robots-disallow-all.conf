# Serves a robots.txt that disallows crawling the whole site. Include inside
# server {}:
#   include snippets/robots-disallow-all.conf;
#
# It asks robots not to crawl; it does not keep pages out of the index, a page
# with an external link can be listed without crawling. Use X-Robots-Tag or
# meta name=robots for that. The exact match silently takes /robots.txt from
# the consumer: meant for staging and service hosts, not production sites.
#
# default_type is required: 010-common.conf sets application/octet-stream for
# all of http {}, and the browser would download robots.txt as a file.
location = /robots.txt {
  access_log off;
  default_type text/plain;
  return 200 "User-agent: *\nDisallow: /\n";
}
