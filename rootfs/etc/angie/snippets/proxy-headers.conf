# Common proxy header set. Include inside location {}:
#   include snippets/proxy-headers.conf;
# Upstream, timeouts and buffering stay in your location.
#
# X-Forwarded-For is REPLACED, not appended: the set targets the edge proxy,
# which has no reason to trust the client's chain. Behind another trusted proxy
# you want $proxy_add_x_forwarded_for, so write your own set instead: repeating
# proxy_set_header on the same level JOINS the values into one header rather
# than overriding.
#
# X-Request-ID is replaced by the server's $request_id, which the image's access
# logs also record, so log and application entries match on one value.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
