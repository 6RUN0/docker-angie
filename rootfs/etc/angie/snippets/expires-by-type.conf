# Cache lifetime by content type. Include inside a location or server that
# serves static files:
#
#   location /static/ {
#     include snippets/expires-by-type.conf;
#   }
#
# The variable is declared by http-conf-available.d/023-expires.conf, enabled
# by ANGIE_EXPIRES_ENABLED. Without it startup fails with
# `[emerg] unknown "_stock_expires" variable`.
#
# Do not set this in the http context, as h5bp does: it would also cover
# proxied responses and override the upstream application's caching policy.
# See 023-expires.conf.
expires $_stock_expires;
