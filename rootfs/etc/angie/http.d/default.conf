server {
  # No `default_server`: the first server declared on an address becomes its
  # default, and angie.conf includes the image's http.d before both consumer
  # include points. A consumer declares `listen 80 default_server` in
  # custom/http.d without hitting `a duplicate default server`; it needs the
  # flag on both listen lines, the default is picked per 0.0.0.0 and [::].
  listen 80;
  listen [::]:80;

  # A name is required: a server without server_name gets the empty name, which
  # matches requests WITHOUT a Host header and silently takes them from the
  # consumer's default server. A reserved .invalid domain rather than `_`
  # avoids `conflicting server name "_"` warnings for consumers using `_`.
  server_name healthz-catchall.invalid;

  # The HEALTHCHECK sends `Host: healthz-catchall.invalid`: an exact name match
  # beats the default server, so the endpoint stays with the image even after a
  # consumer takes default_server. The name is no secret; a remote client gets
  # 404 from the $_stock_loopback gate inside the snippet.
  include snippets/healthz.conf;

  # Console Light lives in the catch-all, not its own server {}: a panel server
  # in http-conf.d would be included before http.d and silently take the
  # default. The shipped file is a comment-only stub, rendered by 40-console.sh.
  # A consumer with its own default_server includes the same line there.
  include snippets/console.conf;

  location / {
    return 444;
  }
}
