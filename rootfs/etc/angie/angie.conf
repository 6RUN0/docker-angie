# This is a modified configuration from the nginx package in alpine linux.
# Some parameters have been moved to separate files so that this file contains
# mostly inclusions. /etc/angie/custom/ is the docker volume for implementing
# the custom configuration.

# Set number of worker processes automatically based on number of CPU cores.
worker_processes auto;

# Set number of file descriptors that can be opened by worker processes.
worker_rlimit_nofile 65536;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

# Graceful-stop limit: how long a worker keeps serving open connections after
# SIGQUIT (the image STOPSIGNAL) or HUP before closing the rest itself. Kept
# below docker's default stop_grace_period (10s), otherwise a long connection
# (websocket, slow download) drives the container to SIGKILL and exit 137. A
# main-context directive cannot be declared twice, so custom/conf.d cannot
# override it: 32-worker-shutdown-timeout.sh rewrites this line from
# ANGIE_WORKER_SHUTDOWN_TIMEOUT, whose default matches it.
worker_shutdown_timeout 8s;

# Default error logger. The line matches the ANGIE_ERROR_LOG_JSON_ENABLED
# default, so the toggle leaves it alone and the default format holds even on
# a read-only root.
error_log /dev/stderr format=json;

# Image-owned includes are relative to the runtime prefix. Consumer includes
# remain absolute so /etc/angie/custom is never copied into the live tree.
include modules.d/*.conf;

include conf.d/*.conf;
include /etc/angie/custom/conf.d/*.conf;

events {
  # The maximum number of simultaneous connections per worker. Kept at half of
  # worker_rlimit_nofile (65536): a proxied connection uses two descriptors
  # (client + upstream), so the fd limit must cover twice the connection count.
  worker_connections 32768;
  multi_accept on;
}

http {
  include http-conf.d/*.conf;
  # The built-in catch-all must precede both consumer include points: the first
  # server declared on an address becomes its default, and http.d/default.conf
  # carries no default_server flag. A `server {}` dropped into
  # custom/http-conf.d would otherwise take the default silently.
  include http.d/*.conf;
  include /etc/angie/custom/http-conf.d/*.conf;
  include /etc/angie/custom/http.d/*.conf;
}
