# Dependabot tracks what it can resolve declaratively: base images in the two
# Dockerfiles (FROM/ARG ...=image:tag) and the GitHub Actions used in workflows.
#
# It does NOT track the angie/angie-module-* apk/apt packages (pinned via
# ARG ANGIE_VERSION, installed inside RUN). The upstream-check workflow opens
# a PR for newer Angie packages. Console Light and the vendored angie-ctl are
# updated manually with their integration tests.
version: 2
updates:
  - package-ecosystem: docker
    directory: /alpine
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /debian
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
