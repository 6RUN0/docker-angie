name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] (no git push; persisted token unused)
      - name: Install pinned shellcheck
        # Pin the version: the runner's bundled shellcheck drifts and reports
        # different findings than developers run locally (e.g. SC2015), making
        # the lint gate non-reproducible. Verify the download by checksum.
        env:
          SC_VERSION: v0.11.0
          SC_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  sc.tar.xz" | sha256sum -c -
          tar -xJf sc.tar.xz
          sudo install "shellcheck-${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: shellcheck
        run: make lint-shell
      - name: Helper regression tests
        run: make test-unit
      - name: $_stock_ prefix of shipped config variables
        run: make lint-conf-vars
      - name: Install pinned lychee
        # Same pinning as shellcheck: a checksum-verified release, so the link
        # gate runs the version developers run locally.
        env:
          LYCHEE_VERSION: v0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          curl -fsSL -o lychee.tar.gz "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz
          sudo install lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
          lychee --version
      - name: lychee (local links and anchors, offline)
        run: make lint-docs-local-links
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: gixy (config security lint)
        run: make lint-config
      - name: hadolint (alpine)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: alpine/Dockerfile
      - name: hadolint (debian)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: debian/Dockerfile

  build-test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: alpine
            dockerfile: alpine/Dockerfile
          - variant: debian
            dockerfile: debian/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] (no git push; persisted token unused)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: standard
          load: true
          tags: angie-${{ matrix.variant }}:test
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: matrix.variant == 'alpine'
        with:
          # One-shot `uvx gixy`; caching is pointless and only adds a
          # cache-poisoning surface next to the build cache in this job.
          enable-cache: false
      - name: gixy (full effective config)
        # The effective config is identical across variants, so lint it once on
        # alpine, against the real assembled angie -T (not just the fragments).
        if: matrix.variant == 'alpine'
        run: make lint-config-full IMAGE_ALPINE=angie-alpine:test
      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: angie-${{ matrix.variant }}:test
          severity: CRITICAL,HIGH
          # Fail only on CVEs that have an upstream fix available - the image
          # tracks upstream security updates, so a fixable CVE means it is stale
          # and a rebuild resolves it. Unfixed CVEs would block CI with no action
          # the maintainer can take.
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke test
        run: IMAGE=angie-${{ matrix.variant }}:test ./test/smoke.sh
      - name: Read-only layout and feature tests
        run: IMAGE=angie-${{ matrix.variant }}:test PORT=80 ./test/smoke-layout.sh
      - name: Build rootless image
        # Same builder and cache scope as the standard target: the shared
        # runtime stage comes from the cache, only the unprivileged layers build.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: unprivileged
          load: true
          tags: angie-${{ matrix.variant }}-unprivileged:test
          cache-from: |
            type=gha,scope=${{ matrix.variant }}
            type=gha,scope=${{ matrix.variant }}-unprivileged
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-unprivileged
      - name: Smoke test (rootless)
        run: IMAGE=angie-${{ matrix.variant }}-unprivileged:test ./test/smoke-unprivileged.sh
      - name: Read-only layout and feature tests (rootless)
        run: IMAGE=angie-${{ matrix.variant }}-unprivileged:test PORT=8080 ./test/smoke-layout.sh
